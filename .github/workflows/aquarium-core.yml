name: Aquarium Unity assets
on:
  pull_request:
    paths:
      - 'unity/Assets/Aquarium/**'
      - 'unity/Assets/Aquarium.meta'
      - 'unity/ProjectSettings/EditorBuildSettings.asset'
      - 'tools/**'
      - '.github/workflows/aquarium-core.yml'
  push:
    branches: [main]
    paths:
      - 'unity/Assets/Aquarium/**'
      - 'unity/Assets/Aquarium.meta'
      - 'tools/**'
      - '.github/workflows/aquarium-core.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Unity asset structure (not Unity import)
        run: dotnet run --project tools/Aquarium.AssetValidator/Aquarium.AssetValidator.csproj --configuration Release
