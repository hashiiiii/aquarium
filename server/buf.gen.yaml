version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
    - file_option: csharp_namespace
  override:
    - file_option: go_package_prefix
      value: github.com/hashiiiii/aquarium/gen # package path is determined relative to go.mod
inputs:
  - directory: ../api/proto
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative