version: v2
managed:
  enabled: true
  disable:
    # not to edit import path by override option.
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      # package path is determined relative to go.mod
      value: github.com/hashiiiii/aquarium/gen
inputs:
  - directory: ../api/proto
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
      # see: https://github.com/connectrpc/connect-go/pull/851
      - simple