# Run through cmd/reef-codegen, which supplies a clean schema root and
# excludes the older session/auth prototype's Buf configuration and lock file.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
      - simple
